<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GVME Fichadas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#346CB6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fichadas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E9EDF3;--surface:#F8FAFD;--line:#C9D2DE;--fg:#15233A;--muted:#56647A;
  --accent:#346CB6;--accent-dark:#24508A;--accent-soft:#D9E8F8;
  --red:#D7262E;--amber:#E8A300;--amber-text:#8A6100;--green:#2E9E44;--green-text:#1F6E30;
  --red-soft:#F7DCDD;--amber-soft:#FBEFCC;--green-soft:#D8EEDC;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));gap:14px}
.app.desk{max-width:1240px;padding:20px 24px 40px}
.h-display{font-family:var(--f-display);font-weight:700;letter-spacing:.5px;line-height:1.05;margin:0}
.t-xl{font-size:34px}.t-l{font-size:28px}.t-m{font-size:22px}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card.ok{background:var(--green-soft);border-color:var(--green)}
.card.warn{background:var(--amber-soft);border-color:var(--amber)}
.card.bad{background:var(--red-soft);border-color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grow{flex:1 1 auto}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:17px;width:100%}
textarea.inp{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
select.inp{padding:0 10px}
.btn{height:54px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:1px}
.btn.warn{background:#B57F00;border-color:#B57F00;color:#fff;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:1px}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.dashed{border:1.5px dashed var(--accent);color:var(--accent);background:transparent}
.btn.sm{height:42px;font-size:14px;border-radius:10px;padding:0 14px}
.btn.block{width:100%}
.big{width:230px;height:230px;border-radius:50%;border:10px solid var(--accent-soft);background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:6px auto;box-shadow:0 10px 30px rgba(52,108,182,.3)}
.big.out{background:var(--fg);border-color:#D5DBE4}
.big b{font-family:var(--f-display);font-weight:700;font-size:38px;letter-spacing:1px}
.big small{font-size:13px;font-weight:600;opacity:.9}
.logo{height:34px;width:auto;display:block}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.clock{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1}
.nav{display:grid;gap:8px;margin-top:auto;padding-top:8px}
.nav a{height:50px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none;color:var(--muted);background:transparent;font-size:15px}
.nav a.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--fg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{padding:9px 14px;border-radius:10px;border:1px solid var(--line);text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;background:var(--surface)}
.tabs a.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{height:46px;border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:1px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.kpi b{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.1}
.dot{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
.bar{height:7px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%}
.verde{--c:var(--green)}.amarillo{--c:var(--amber)}.rojo{--c:var(--red)}.sin_dotacion{--c:var(--line)}
.c-txt{color:var(--c)}.amarillo .c-txt{color:var(--amber-text)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.item.pend{border-color:var(--amber)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--bg)}
.tag.ok{background:var(--green-soft);color:var(--green-text)}.tag.warn{background:var(--amber-soft);color:var(--amber-text)}.tag.bad{background:var(--red-soft);color:var(--red)}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 10px;color:var(--muted);text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.circle{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto 6px}
.center{text-align:center}
.photo{width:100%;border-radius:14px;background:var(--accent-soft);display:block;object-fit:cover}
video.photo{aspect-ratio:3/4;background:#000}
.checks span{display:flex;gap:6px;align-items:center;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
.tbl th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px;background:var(--bg);border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--bg)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:100;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#wmw{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#wm{position:absolute;left:-60%;top:-60%;width:220%;height:220%;transform:rotate(-30deg);font-weight:600;font-size:15px;color:var(--fg);opacity:.07;line-height:84px;white-space:nowrap;word-spacing:4px}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:flex-end;justify-content:center;z-index:80;padding:12px}
.modal .sheet{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
details summary{cursor:pointer;font-weight:600}
details.item summary{font-weight:400}details.item summary::-webkit-details-marker{display:none}details.item[open]{box-shadow:0 2px 10px rgba(21,35,58,.08)}
.err{color:var(--red);font-size:14px;min-height:18px}
@media (min-width:900px){.modal{align-items:center}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="wmw" aria-hidden="true"><div id="wm"></div></div>
<div id="toast" role="status" hidden></div>
<script>
/* =====================================================================
 *  GVME Fichadas · app web  ·  versión 1.0
 *  ÚNICO DATO A COMPLETAR: pegá entre las comillas la dirección de la
 *  aplicación web de Apps Script (termina en /exec).
 * ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyZJbuDzogg1THl3Y7wt2FIN3NUl3s7s1Gy4DJH7JGuWrb1taWSJ42zpntTmHE2LIuG/exec';

const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const MODO = new URLSearchParams(location.search).has('escritorio') ? 'escritorio' : 'celular';
const TK = 'gvme_fichadas_' + MODO;
const LOGO = 'logo.png';
const S = { token: store.get(TK), user: null, view: '', params: {}, est: null, pos: null, mes: '', comp: null, stream: null };
const app = document.getElementById('app');
const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const ICO = {
  pin: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  in: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>',
  out: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>',
  check: '<svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  clock: '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  warn: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  nopin: '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><path d="m9.5 7.5 5 5"/><path d="m14.5 7.5-5 5"/></svg>',
  people: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M19 8v6M16 11h6"/></svg>',
  cam: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E9E44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D7262E" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};

/* ---------- utilidades ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function $(sel) { return document.querySelector(sel); }
function pad(n) { return String(n).padStart(2, '0'); }
function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function hora() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fechaCorta(f) { const [y, m, d] = String(f).split('-').map(Number); const x = new Date(y, m - 1, d); return DIAS[x.getDay()] + ' ' + pad(d) + '/' + pad(m); }
function fechaHora() { const d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + hora(); }
function norm(x) { return String(x || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function num(x) { return (Math.round((Number(x) || 0) * 10) / 10).toLocaleString('es-AR'); }
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, ms || 3500); }
function loadScript(src) { return new Promise((res, rej) => { if (document.querySelector('script[src="' + src + '"]')) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); }); }

async function api(action, data) {
  if (!/^https:\/\//.test(API_URL)) throw new Error('Falta configurar la dirección del sistema (API_URL en index.html).');
  let r;
  try { r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, token: S.token }, data || {})) }); }
  catch (e) { throw new Error('Sin conexión. Revisá los datos móviles o el wifi y probá de nuevo.'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('El sistema no respondió bien. Probá de nuevo en un rato.'); }
  if (!j.ok) {
    const e = new Error(j.error || 'Error');
    e.code = j.code;
    if (j.code === 'SESION' && action !== 'login') { setTimeout(() => salir(true), 50); }
    throw e;
  }
  return j;
}

function gps(fresca) {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Este navegador no permite tomar la ubicación.'));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
      e => rej(new Error(e.code === 1 ? 'Tenés que permitir la ubicación para fichar. Revisá los permisos del navegador para esta página.' : 'No pudimos tomar tu ubicación. Activá el GPS y probá de nuevo.')),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: fresca ? 0 : 15000 });
  });
}
function gpsMejor(objetivo, esperaMs, onProgreso) {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Este navegador no permite tomar la ubicación.'));
    let mejor = null;
    const fin = () => { navigator.geolocation.clearWatch(id); clearTimeout(t); mejor ? res(mejor) : rej(new Error('No pudimos tomar la ubicación. Activá el GPS y probá de nuevo.')); };
    const id = navigator.geolocation.watchPosition(p => {
      const x = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) };
      if (!mejor || x.acc < mejor.acc) mejor = x;
      if (onProgreso) onProgreso(mejor);
      if (mejor.acc <= objetivo) fin();
    }, e => { if (e.code === 1) { navigator.geolocation.clearWatch(id); clearTimeout(t); rej(new Error('Tenés que permitir la ubicación.')); } }, { enableHighAccuracy: true, maximumAge: 0, timeout: esperaMs });
    const t = setTimeout(fin, esperaMs);
  });
}

/* ---------- marca de agua e inactividad ---------- */
function wmUpdate() {
  const wm = $('#wm');
  if (!S.user) { wm.innerHTML = ''; return; }
  const t = esc(S.user.nombre);   // solo nombre y apellido
  const linea = Array(6).fill('<span>' + t + '</span>').join('&nbsp;&nbsp;&nbsp;&nbsp;');
  wm.innerHTML = Array(40).fill(linea).join('<br>');
}
setInterval(wmUpdate, 60000);
let ultimaAccion = Date.now();
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { ultimaAccion = Date.now(); }, { passive: true }));
const VISTAS_SUP = ['sup', 'personas', 'revisar', 'obra', 'especial', 'planilla', 'pendientes', 'obras', 'importar', 'pin'];
setInterval(() => {
  if (!S.user || Date.now() - ultimaAccion < 5 * 60000) return;
  if (MODO === 'escritorio') { salir(false); toast('La sesión se cerró por 5 minutos sin uso.', 6000); }
  else if (VISTAS_SUP.indexOf(S.view) >= 0) go('fichar');
}, 30000);

/* ---------- navegación ---------- */
const V = {};
function go(view, params) {
  if (S.stream) camStop();
  if (typeof autoCancelar === 'function') autoCancelar();
  S.view = view; S.params = params || {};
  window.scrollTo(0, 0);
  (V[view] || V.fichar)(S.params);
}
function home() { return MODO === 'escritorio' ? 'planilla' : 'fichar'; }
function shell(html, nav) {
  app.className = 'app' + (MODO === 'escritorio' && S.user ? ' desk' : '');
  app.innerHTML = (MODO === 'escritorio' && S.user ? deskHeader() : '') + html + (MODO === 'celular' && S.user && nav ? navCel(nav) : '');
}
function navCel(on) {
  const it = [['fichar', 'Fichar'], ['horas', 'Mis horas']];
  if (S.user.supervisa) it.push(['sup', 'Supervisión']);
  const nav = '<nav class="nav" style="margin-top:0;grid-template-columns:repeat(' + it.length + ',minmax(0,1fr))">' + it.map(x => '<a href="#" data-go="' + x[0] + '" class="' + (x[0] === on ? 'on' : '') + '">' + x[1] + '</a>').join('') + '</nav>';
  const btn = S.user.ubica ? '<button class="btn block" data-act="nuevaUbicacion" style="border:1.5px solid var(--accent);color:var(--accent);background:#fff">' + ICO.pin + ' Nueva ubicación de obra</button>' : '';
  return '<div style="margin-top:auto;display:grid;gap:8px;padding-top:8px">' + btn + nav + '</div>';
}
function deskHeader() {
  const it = [['planilla', 'Planilla resumen'], ['personas', 'Personas']];
  if (S.user.aprueba) it.push(['pendientes', 'Por autorizar'], ['obras', 'Obras'], ['importar', 'Importar personal']);
  if (S.user.gerencia) it.push(['pin', 'PIN y celulares']);
  return '<header class="top" style="align-items:center;flex-wrap:wrap"><div class="row" style="gap:14px"><img class="logo" src="' + LOGO + '" alt="GVME"><span class="h-display t-m" style="color:var(--accent)">FICHADAS</span></div>' +
    '<div class="row small"><span>' + esc(S.user.nombre) + ' · ' + esc(S.user.rolTxt) + '</span><button class="btn sm" data-act="salir">Salir</button></div></header>' +
    '<nav class="tabs">' + it.map(x => '<a href="#" data-go="' + x[0] + '" class="' + (x[0] === S.view ? 'on' : '') + '">' + x[1] + '</a>').join('') + '</nav>';
}
function cargando(txt, nav) { shell('<div class="loading"><div class="spin"></div><div>' + esc(txt) + '</div></div>', nav); }
function errorBox(msg, nav, reintentar) {
  shell('<div class="card bad stack"><b>No se pudo completar</b><span>' + esc(msg) + '</span>' + (reintentar ? '<button class="btn" data-go="' + reintentar + '">Reintentar</button>' : '') + '</div>', nav);
}

app.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go, g.dataset.p ? JSON.parse(g.dataset.p) : {}); return; }
  const a = e.target.closest('[data-act]');
  if (!a || !ACT[a.dataset.act]) return;
  if (a.tagName === 'INPUT') { setTimeout(() => ACT[a.dataset.act](a), 0); return; }
  e.preventDefault(); ACT[a.dataset.act](a);
});
const ACT = {};

function salir(sesionVencida) {
  const t = S.token;
  if (MODO === 'escritorio' && t && !sesionVencida) api('logout').catch(() => { });
  if (MODO === 'escritorio' || sesionVencida) { S.token = ''; store.del(TK); }
  S.user = null; wmUpdate(); go('login');
}

async function boot() {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  if (!S.token) return go('login');
  cargando('Entrando…');
  try { const r = await api('me'); S.user = r.user; wmUpdate(); go(home()); }
  catch (e) { if (e.code === 'SESION') { S.token = ''; store.del(TK); go('login'); } else errorBox(e.message, null, 'fichar'); }
}

/* =====================================================================
 *  Ingreso
 * ===================================================================== */
V.login = function () {
  const cel = MODO === 'celular';
  shell(
    '<div class="row" style="justify-content:flex-start;gap:14px;margin-top:20px"><img class="logo" src="' + LOGO + '" alt="GVME" style="height:40px">' +
    '<div style="border-left:2px solid var(--line);padding-left:14px"><div class="h-display t-m" style="color:var(--accent)">FICHADAS</div><div class="xs muted">Ingeniería en Montajes Eléctricos</div></div></div>' +
    '<div style="margin-top:24px"><h1 class="h-display" style="font-size:40px">' + (cel ? 'Ingresá con tu legajo' : 'Ingreso de supervisión') + '</h1>' +
    '<p class="muted" style="margin:8px 0 0">' + (cel ? 'Tu legajo se carga una sola vez: después este celular te recuerda.' : 'Para supervisores, jefes de obra, RRHH y Gerencia.') + '</p></div>' +
    '<form id="fLogin" class="stack" style="gap:16px" autocomplete="off">' +
    '<label class="f">Legajo<input class="inp" id="lLeg" inputmode="numeric" pattern="[0-9]*" required></label>' +
    '<label class="f">PIN · últimos 4 números de tu DNI<input class="inp" id="lPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" required style="letter-spacing:8px"></label>' +
    (cel ? '<label class="row small" style="justify-content:flex-start;align-items:flex-start;gap:12px;color:var(--muted)"><input type="checkbox" id="lCons" style="width:22px;height:22px;margin:0;flex:none;accent-color:#346CB6"><span>Acepto que se registre mi ubicación solo en el momento de fichar, para validar que estoy en la obra. <a href="#" data-act="consentimiento">Leer el consentimiento</a></span></label>' : '') +
    '<div class="err" id="lErr"></div>' +
    '<button class="btn primary block" id="lBtn" type="submit">INGRESAR</button></form>' +
    '<p class="center small muted" style="margin:0">¿Querés cambiar el PIN? Pedíselo a Gerencia.</p>' +
    (cel ? '<p class="center xs muted" style="margin:0">En iPhone: primero agregá esta página a la pantalla de inicio (Compartir › Agregar a inicio) y recién después ingresá desde el ícono.</p>' : ''));
  $('#fLogin').onsubmit = async ev => {
    ev.preventDefault();
    const leg = $('#lLeg').value.trim(), pin = $('#lPin').value.trim();
    const cons = cel ? $('#lCons').checked : true;
    const err = $('#lErr'), btn = $('#lBtn');
    err.textContent = '';
    if (!leg || !/^\d{4}$/.test(pin)) { err.textContent = 'Revisá el legajo y el PIN de 4 números.'; return; }
    if (cel && !cons) { err.textContent = 'Para usar la app tenés que aceptar el consentimiento.'; return; }
    btn.disabled = true; btn.textContent = 'ENTRANDO…';
    try {
      const r = await api('login', { legajo: leg, pin: pin, tipo: MODO, consentimiento: cons });
      S.token = r.token; store.set(TK, r.token); S.user = r.user; wmUpdate(); go(home());
    } catch (e) {
      err.textContent = e.message;
      if (e.code === 'VINCULADO') {
        err.innerHTML = esc(e.message) + '<br><button type="button" class="btn sm" id="lPed" style="margin-top:8px">Pedir a Gerencia que vincule este celular</button>';
        $('#lPed').onclick = async () => { try { const x = await api('pedirDesvinculo', { legajo: leg, pin: pin }); toast(x.mensaje, 6000); } catch (e2) { toast(e2.message); } };
      }
    } finally { btn.disabled = false; btn.textContent = 'INGRESAR'; }
  };
};

ACT.consentimiento = function () {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="sheet" role="dialog" aria-label="Consentimiento"><h2 class="h-display t-l" style="margin:0">Consentimiento</h2>' +
    '<p class="small">GVME Ingeniería en Montajes Eléctricos usa esta app para registrar tu entrada y salida en obra. Al aceptar, autorizás a GVME a:</p>' +
    '<ul class="small" style="margin:0;padding-left:20px"><li>Usar tu celular personal para fichar, sin instalar nada.</li><li>Registrar tu ubicación <b>solo en el momento de fichar</b>, para comprobar que estás en la obra. La app no te sigue ni registra tu ubicación en otro momento.</li><li>Guardar tu legajo, nombre, categoría, obra, horario de cada fichada y las horas trabajadas, para liquidar sueldos e imputar horas a las obras.</li><li>Si un compañero te ficha, guardar una foto tuya de ese momento para que la revise tu supervisor. La foto se borra sola a los 60 días.</li></ul>' +
    '<p class="small">Tus datos los usa solo GVME para estos fines. Podés pedir acceso, corrección o eliminación de tus datos a Gerencia, según la Ley 25.326 de Protección de Datos Personales. La Agencia de Acceso a la Información Pública es el organismo de control.</p>' +
    '<p class="xs muted">Texto v1 · a revisar por el asesor legal de GVME.</p>' +
    '<button class="btn primary block" type="button">CERRAR</button></div>';
  m.querySelector('button').onclick = () => m.remove();
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
};

/* =====================================================================
 *  Fichar
 * ===================================================================== */
V.fichar = async function () {
  cargando('Buscando tu ubicación…', 'fichar');
  try {
    S.pos = await gps(false);
    S.est = await api('estado', S.pos);
    if (S.view === 'fichar') { drawFichar(); autoFichar(); }
  } catch (e) { errorBox(e.message, 'fichar', 'fichar'); }
};

function encabezado() {
  return '<div class="top"><div><div class="small muted">Hola,</div><div class="h-display t-l">' + esc(String(S.user.nombre).toUpperCase()) + '</div>' +
    '<div class="small muted">Legajo ' + esc(S.user.legajo) + (S.user.categoria ? ' · ' + esc(S.user.categoria) : '') + '</div></div>' +
    '<div style="text-align:right"><div class="clock" id="reloj">' + hora() + '</div><div class="small muted">' + fechaCorta(hoyISO()) + '</div></div></div>';
}

function drawFichar() {
  const e = S.est, prox = e.proximo, lbl = prox === 'in' ? 'ENTRADA' : 'SALIDA';
  const enZona = e.obras.filter(o => o.zona === 'ok'), fuera = e.obras.filter(o => o.zona === 'fuera');
  let main = '';
  const ab = prox === 'out' ? e.abierta : null;
  if (ab) main = pantallaSalida(e, ab, enZona);
  else if (enZona.length) {
    const sel = enZona.find(o => o.id === e.ultimaObra) || enZona[0];
    main = '<div class="card ok row" style="justify-content:flex-start;gap:14px"><span style="color:var(--green)">' + ICO.pin + '</span><div><b>Estás en ' + esc(sel.nombre) + '</b><div class="small" style="color:var(--green-text)">A ' + sel.dist + ' m de la obra · GPS ±' + e.acc + ' m</div></div></div>' +
      (enZona.length > 1 ? '<label class="f">Obra<select class="inp" id="fObra">' + enZona.map(o => '<option value="' + esc(o.id) + '"' + (o.id === sel.id ? ' selected' : '') + '>' + esc(o.nombre) + ' · ' + o.dist + ' m</option>').join('') + '</select></label>' : '<input type="hidden" id="fObra" value="' + esc(sel.id) + '">') +
      '<div class="grow" style="display:flex;align-items:center;justify-content:center"><button class="big' + (prox === 'out' ? ' out' : '') + '" data-act="fichar">' + ICO[prox] + '<b>' + lbl + '</b><small>Tocá para fichar</small></button></div>';
  } else if (fuera.length || e.sinGeo.length || (e.lejos || []).length) {
    let aviso;
    if (e.precisionMala) aviso = 'Tu GPS tiene poca precisión (±' + e.acc + ' m). Podés fichar igual: queda pendiente de aprobación.';
    else if (fuera.length) aviso = 'Estás a <b>' + fuera[0].dist + ' m</b> de <b>' + esc(fuera[0].nombre) + '</b>. Para fichar normal tenés que estar a menos de ' + (fuera[0].radio || e.zonaFichar) + ' m.';
    else if (e.cercana) aviso = 'No estás cerca de ninguna obra: la más cercana es <b>' + esc(e.cercana.nombre) + '</b>, a <b>' + kmTxt(e.cercana.dist) + '</b>. Elegí la obra: la fichada queda pendiente de aprobación.';
    else aviso = 'Las obras todavía no tienen la ubicación cargada. Elegí la tuya: la fichada queda pendiente de aprobación.';
    const op = (o, txt) => '<option value="' + esc(o.id) + '"' + (o.id === e.ultimaObra ? ' selected' : '') + '>' + esc(o.nombre) + ' · ' + txt + '</option>';
    const grupo = (lbl, L, f) => L.length ? '<optgroup label="' + lbl + '">' + L.map(o => op(o, f(o))).join('') + '</optgroup>' : '';
    const opts = grupo('Cerca de tu ubicación', fuera, o => o.dist + ' m') +
      grupo('Con ubicación cargada', e.lejos || [], o => o.dist === null ? 'sin GPS' : 'a ' + kmTxt(o.dist)) +
      grupo('Sin ubicación cargada', e.sinGeo, () => 'sin ubicación');
    main = '<div class="card warn stack" style="gap:8px"><div class="row" style="justify-content:flex-start;gap:10px;color:#B57F00">' + ICO.warn + '<b style="color:var(--fg)">Estás fuera de la zona de fichada</b></div><span class="small">' + aviso + '</span></div>' +
      '<span class="small muted">Si tenés que fichar igual, contá por qué. Queda <b>pendiente</b> hasta que la apruebe tu supervisor, jefe de obra, RRHH o Gerencia.</span>' +
      '<label class="f">Obra<select class="inp" id="fObra">' + opts + '</select></label>' +
      '<label class="f">Motivo<textarea class="inp" id="fMotivo" maxlength="300" placeholder="Ej.: estoy en el obrador de enfrente"></textarea></label>' +
      '<button class="btn warn block" data-act="fichar">FICHAR ' + lbl + ' FUERA DE ZONA</button>';
  } else {
    main = '<div class="circle" style="background:var(--red-soft);color:var(--red)">' + ICO.nopin + '</div><h2 class="h-display t-l center">NO HAY OBRAS CERCA</h2>' +
      '<p class="center muted" style="margin:0">' + (e.cercana ? 'La obra más cercana es <b>' + esc(e.cercana.nombre) + '</b>, a <b>' + kmTxt(e.cercana.dist) + '</b>. ' : '') + 'Para fichar tenés que estar a menos de ' + e.zonaVer + ' m de una obra.</p>' +
      '<div class="card stack small" style="gap:6px"><div class="row"><span class="muted">Tu ubicación</span><span>GPS ±' + e.acc + ' m</span></div><div class="row"><span class="muted">Fichar normal</span><span>a menos de ' + e.zonaFichar + ' m</span></div><div class="row"><span class="muted">Fuera de zona con motivo</span><span>de ' + e.zonaFichar + ' a ' + e.zonaVer + ' m</span></div></div>' +
      '<p class="small muted" style="margin:0">Si estás en la obra y el GPS marca mal, salí a un lugar abierto y volvé a intentar. Si sigue igual, avisale a tu supervisor.</p>';
  }
  const hoy = e.hoy.length ? e.hoy.map(f => '<div class="row small"><span>' + (f.tipo === 'in' ? 'Entrada' : 'Salida') + ' ' + esc(f.hora) + ' · ' + esc(f.obra) + '</span>' + estadoTag(f.estado) + '</div>').join('') : '<span class="small muted">Todavía no fichaste hoy.</span>';
  shell(encabezado() + main +
    '<div class="stack" style="gap:6px"><span class="xs muted" style="font-weight:600;letter-spacing:1px">HOY</span><div class="card stack" style="gap:6px">' + hoy + '</div></div>' +
    '<div class="grid2"><button class="btn sm" data-go="fichar">Actualizar ubicación</button><button class="btn sm dashed" data-go="companero">' + ICO.people + ' Fichar a un compañero</button></div>', 'fichar');
}
function pantallaSalida(e, ab, enZona) {
  const otras = enZona.filter(o => o.id !== ab.obra_id);
  const desde = '<span class="small muted">Entrada en <b>' + esc(ab.obra) + '</b> a las ' + esc(ab.hora) + '</span>';
  const oculto = '<input type="hidden" id="fObra" value="' + esc(ab.obra_id) + '">';
  if (ab.zona === 'ok' && (ab.cerca || !otras.length)) {
    return '<div class="card ok row" style="justify-content:flex-start;gap:14px"><span style="color:var(--green)">' + ICO.pin + '</span><div><b>Estás en ' + esc(ab.obra) + '</b><div class="small" style="color:var(--green-text)">A ' + ab.dist + ' m de la obra · GPS ±' + e.acc + ' m</div></div></div>' + oculto +
      '<div class="grow" style="display:flex;align-items:center;justify-content:center"><button class="big out" data-act="fichar">' + ICO.out + '<b>SALIDA</b><small>Tocá para fichar</small></button></div>';
  }
  if (otras.length) {
    const sel = otras[0];
    return '<div class="card ok row" style="justify-content:flex-start;gap:14px"><span style="color:var(--green)">' + ICO.pin + '</span><div><b>Estás en ' + esc(sel.nombre) + '</b><div class="small" style="color:var(--green-text)">A ' + sel.dist + ' m de la obra · GPS ±' + e.acc + ' m</div></div></div>' +
      '<div class="card stack small" style="gap:4px"><b>Tenés la entrada abierta en ' + esc(ab.obra) + ' desde las ' + esc(ab.hora) + '</b><span class="muted">Al entrar acá se cierra sola la salida de ' + esc(ab.obra) + ' a esta hora. Así cada obra se lleva sus horas.</span></div>' +
      (otras.length > 1 ? '<label class="f">Obra nueva<select class="inp" id="fCambio">' + otras.map(o => '<option value="' + esc(o.id) + '">' + esc(o.nombre) + ' · ' + o.dist + ' m</option>').join('') + '</select></label>' : '<input type="hidden" id="fCambio" value="' + esc(sel.id) + '">') +
      '<div class="grow" style="display:flex;align-items:center;justify-content:center"><button class="big" data-act="cambiar">' + ICO.in + '<b style="font-size:30px">CAMBIO DE OBRA</b><small>Salir de ' + esc(ab.obra) + ' y entrar acá</small></button></div>';
  }
  if (ab.zona === 'fuera' || ab.zona === 'singeo') {
    const aviso = ab.zona === 'singeo' ? esc(ab.obra) + ' todavía no tiene la ubicación cargada: la salida queda pendiente de aprobación.' : 'Estás a <b>' + ab.dist + ' m</b> de <b>' + esc(ab.obra) + '</b>. Para fichar normal tenés que estar a menos de ' + e.zonaFichar + ' m.';
    return '<div class="card warn stack" style="gap:8px"><div class="row" style="justify-content:flex-start;gap:10px;color:#B57F00">' + ICO.warn + '<b style="color:var(--fg)">Estás fuera de la zona de fichada</b></div><span class="small">' + aviso + '</span></div>' + desde + oculto +
      '<label class="f">Motivo<textarea class="inp" id="fMotivo" maxlength="300" placeholder="Ej.: estoy en el obrador de enfrente"></textarea></label>' +
      '<button class="btn warn block" data-act="fichar">FICHAR SALIDA FUERA DE ZONA</button>';
  }
  // Lejos de la obra: se ficha normal. Supervisión la revisa aparte (el empleado no ve ningún aviso).
  return desde + oculto +
    '<div class="grow" style="display:flex;align-items:center;justify-content:center"><button class="big out" data-act="fichar">' + ICO.out + '<b>SALIDA</b><small>Fichar la salida de ' + esc(ab.obra) + '</small></button></div>';
}
function kmTxt(m) { return m >= 1000 ? (Math.round(m / 100) / 10).toLocaleString('es-AR') + ' km' : m + ' m'; }
function estadoTag(st) {
  if (st === 'ok' || st === 'aprobada') return '<span class="tag ok">' + (st === 'ok' ? 'Registrada' : 'Aprobada') + '</span>';
  if (st === 'pendiente') return '<span class="tag warn">Pendiente</span>';
  if (st === 'rechazada') return '<span class="tag bad">Rechazada</span>';
  return '<span class="tag">' + esc(st) + '</span>';
}
setInterval(() => { const r = $('#reloj'); if (r) r.textContent = hora(); }, 20000);

ACT.fichar = async function (btn) {
  const obra = $('#fObra') ? $('#fObra').value : '';
  const motivo = $('#fMotivo') ? $('#fMotivo').value.trim() : '';
  const fuera = !!$('#fMotivo');
  if (fuera && !motivo && !(S.est.precisionMala && !(S.est.abierta && S.est.proximo === 'out'))) { toast('Contá el motivo.'); $('#fMotivo').focus(); return; }
  const txt = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<b style="font-size:24px">REGISTRANDO…</b>';
  try {
    const pos = await gps(true);
    const r = await api('fichar', Object.assign({ tipo: S.est.proximo, obra_id: obra, motivo: motivo }, pos));
    if (navigator.vibrate) navigator.vibrate(120);
    go('listo', { f: r.fichada });
  } catch (e) {
    toast(e.message, 6000);
    btn.disabled = false; btn.innerHTML = txt;
  }
};

/* ---------- Fichada automática al abrir la app ----------
 * Una vez por apertura: si al abrir la app está dentro de la zona de una sola obra, ficha la entrada sola;
 * si tiene la entrada abierta, está a menos de 300 m y falta poco para el fin de la jornada (o ya pasó), ficha la salida.
 * Muestra una cuenta regresiva con «Cancelar». No ficha si hubo una fichada en los últimos 15 minutos. */
let autoTimer = null;
function autoCancelar() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } const c = $('#autoBox'); if (c) c.remove(); }
function autoElegible() {
  const e = S.est;
  if (!e || e.auto === false || S.autoUsado || MODO !== 'celular') return false;
  const ult = e.hoy[e.hoy.length - 1];
  if (ult && (Date.now() - new Date(String(ult.at).replace(' ', 'T')).getTime()) < 15 * 60000) return false;
  if (e.proximo === 'in') {
    if (e.precisionMala || $('#fMotivo') || !$('#fObra')) return false;
    return e.obras.filter(o => o.zona === 'ok').length === 1;
  }
  const ab = e.abierta;
  if (!ab || ab.zona !== 'ok' || !ab.fin || !$('[data-act=fichar]') || $('#fMotivo') || $('[data-act=cambiar]')) return false;
  const p = String(ab.fin).split(':'), fin = (+p[0]) * 60 + (+p[1]), d = new Date(), ahora = d.getHours() * 60 + d.getMinutes();
  return ahora >= fin - 15;
}
function autoFichar() {
  if (!autoElegible()) return;
  S.autoUsado = true;
  const btn = $('[data-act=fichar]');
  const tipo = S.est.proximo === 'in' ? 'ENTRADA' : 'SALIDA';
  let n = 5;
  const box = document.createElement('div');
  box.id = 'autoBox'; box.className = 'card stack';
  box.style.cssText = 'gap:10px;border:2px solid var(--accent);background:var(--accent-soft, #D9E8F8)';
  box.innerHTML = '<b style="font-size:18px">Fichando tu ' + tipo + ' en <span id="autoN">' + n + '</span>…</b><span class="small">Lo hacemos solos porque estás en la obra. Si no querés fichar ahora, tocá Cancelar.</span><button class="btn block" data-act="autoCancelar">Cancelar</button>';
  btn.parentNode.parentNode.insertBefore(box, btn.parentNode);
  autoTimer = setInterval(() => {
    if (S.view !== 'fichar' || !document.body.contains(box)) return autoCancelar();
    n--; const el = $('#autoN'); if (el) el.textContent = n;
    if (n <= 0) { autoCancelar(); if (!btn.disabled) ACT.fichar(btn); }
  }, 1000);
}
ACT.autoCancelar = () => { autoCancelar(); toast('Listo, no se fichó. Podés fichar cuando quieras con el botón.'); };
let ocultoDesde = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { ocultoDesde = Date.now(); autoCancelar(); return; }
  if (ocultoDesde && Date.now() - ocultoDesde > 2 * 60000 && S.user && MODO === 'celular') { S.autoUsado = false; if (S.view === 'fichar' || S.view === 'listo') go('fichar'); }
});

ACT.cambiar = async function (btn) {
  const obra = $('#fCambio') ? $('#fCambio').value : '';
  const txt = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<b style="font-size:24px">REGISTRANDO…</b>';
  try {
    const pos = await gps(true);
    const r = await api('fichar', Object.assign({ tipo: 'cambio', obra_id: obra }, pos));
    if (navigator.vibrate) navigator.vibrate(120);
    go('listo', { f: r.fichada, cerrada: r.cerrada });
  } catch (e) { toast(e.message, 6000); btn.disabled = false; btn.innerHTML = txt; }
};

V.listo = function (p) {
  const f = p.f, ok = f.estado === 'ok';
  const tipo = f.tipo === 'in' ? 'ENTRADA' : 'SALIDA';
  shell('<div class="circle" style="width:120px;height:120px;background:' + (ok ? 'var(--green-soft)' : 'var(--amber-soft)') + ';color:' + (ok ? 'var(--green)' : '#B57F00') + '">' + (ok ? ICO.check : ICO.clock) + '</div>' +
    '<div class="center stack" style="gap:6px"><h1 class="h-display t-xl">' + tipo + (ok ? ' REGISTRADA' : ' PENDIENTE') + '</h1>' +
    '<div class="h-display" style="font-size:64px;color:var(--accent)">' + esc(f.hora) + '</div><div class="muted">' + esc(f.obra) + ' · ' + fechaCorta(f.fecha).toLowerCase() + '</div></div>' +
    '<div class="card stack small" style="gap:8px">' +
    (p.cerrada ? '<div class="row"><span class="muted">Salida de ' + esc(p.cerrada.obra) + '</span><span>' + esc(p.cerrada.hora) + ' · cerrada sola</span></div>' : '') +
    '<div class="row"><span class="muted">Ubicación</span><span>' + (ok && !f.causa ? (f.dist !== '' && f.dist != null ? 'A ' + esc(f.dist) + ' m · dentro de la zona' : 'Registrada') : esc(f.causaTxt)) + '</span></div>' +
    '<div class="row"><span class="muted">Comprobante</span><span>' + esc(f.comprobante) + '</span></div>' +

ACT.cTipo = function (b) { const m = $('#cMot'); if (m) S.comp.motivo = m.value; const l = $('#cLeg'); if (l) S.comp.legajo2 = l.value; S.comp.tipo = b.dataset.t; if (S.stream) camStop(); drawComp(); };

      await loadScript('https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js');

const LEAFLET = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
function mapaHtml(it, i) {
  if ((it.kind !== 'fichada' && it.kind !== 'revision') || !it.lat || !Number(it.lat)) return '';
  const gm = 'https://www.google.com/maps/search/?api=1&query=' + it.lat + ',' + it.lng;
  const dist = it.olat ? Math.round(distM(+it.lat, +it.lng, +it.olat, +it.olng)) : null;
  return '<div id="mapa' + i + '" style="height:220px;border-radius:10px;border:1px solid var(--line);background:var(--bg)"></div>' +
    '<div class="row xs muted" style="flex-wrap:wrap"><span><span class="dot" style="width:10px;height:10px;background:#D7262E"></span> Dónde fichó (GPS ±' + esc(it.acc) + ' m)' + (dist != null ? ' · a ' + kmTxt(dist) + ' de la obra' : ' · la obra no tiene ubicación') + '</span><a href="' + gm + '" target="_blank" rel="noopener">Abrir en Google Maps</a></div>';
}
function distM(a, b, c, d) {
  const R = 6371000, t = Math.PI / 180, x = (c - a) * t, y = (d - b) * t;
  const h = Math.sin(x / 2) ** 2 + Math.cos(a * t) * Math.cos(c * t) * Math.sin(y / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function cargarLeaflet() {
  if (!leafletListo) leafletListo = (async () => {
    if (!document.querySelector('link[data-leaflet]')) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = LEAFLET + 'leaflet.min.css'; l.dataset.leaflet = '1'; document.head.appendChild(l); }

  })();
  return leafletListo;
}

  const p = [+it.lat, +it.lng];

  if (it.olat) {
    const o = [+it.olat, +it.olng];
    capas.push(L.circle(o, { radius: it.over || 200, color: '#E8A300', weight: 1, dashArray: '4 4', fillOpacity: 0.04 }).addTo(m));

    L.circleMarker(o, { radius: 6, color: '#fff', weight: 2, fillColor: '#346CB6', fillOpacity: 1 }).addTo(m).bindTooltip(it.obra);
  }
  if (+it.acc > 0) capas.push(L.circle(p, { radius: +it.acc, color: '#D7262E', weight: 1, fillOpacity: 0.1 }).addTo(m));
  capas.push(L.circleMarker(p, { radius: 7, color: '#fff', weight: 2, fillColor: '#D7262E', fillOpacity: 1 }).addTo(m).bindTooltip(it.nombre + ' · ' + it.hora));
  const b = L.featureGroup(capas).getBounds();
  m.fitBounds(b.pad(0.25), { maxZoom: 18 });
}

    const sem = r.semana.map(s => '<div class="kpi"><b style="font-size:16px;font-family:var(--f-body)">' + fechaCorta(s.fecha) + '</b><span class="small" style="color:var(--green-text)">' + s.presentes + ' presentes</span><span class="small" style="color:var(--red)">' + s.ausentes + ' ausentes</span></div>').join('');
    const obras = r.porObra.map(o => '<tr class="' + o.semaforo + '" style="cursor:pointer" data-go="personas" data-p=\'' + esc(JSON.stringify({ obra: o.id, fecha: fecha })) + '\'><td><b>' + esc(o.nombre) + '</b> <span class="xs" style="color:var(--accent)">ver personas ›</span></td><td>' + o.dotacion + '</td><td>' + o.presentes + '</td><td>' + (o.dotacion ? o.presentes - o.dotacion : '—') + '</td><td><span class="row" style="justify-content:flex-start;gap:8px"><span class="dot" style="background:var(--c)"></span><span class="c-txt" style="font-weight:600">' + (o.semaforo === 'verde' ? 'Completa' : o.semaforo === 'sin_dotacion' ? 'Sin dotación' : 'Faltan ' + (o.dotacion - o.presentes)) + '</span></span></td></tr>').join('');
    const aus = r.ausentes.map(a => '<tr><td>' + esc(a.legajo) + '</td><td><b>' + esc(a.nombre) + '</b></td><td>' + esc(a.categoria) + '</td><td>' + esc(a.grupo) + (a.contratista ? ' · ' + esc(a.contratista) : '') + '</td><td>' + esc(a.obra) + '</td><td class="muted">' + esc(a.ultima || '—') + '</td></tr>').join('');
    shell('<div class="row" style="flex-wrap:wrap"><div><h1 class="h-display" style="font-size:40px">PLANILLA RESUMEN</h1><span class="muted">Presentes por obra contra dotación, y ausentes del día</span></div>' +
      '<div class="row"><label class="f">Día<input class="inp" type="date" id="pF" value="' + fecha + '" style="height:44px"></label><button class="btn sm" data-act="planExcel" style="align-self:flex-end">Descargar Excel</button></div></div>' +
      '<div class="kpis">' + kp('Presentes', r.presentes, 'de ' + r.asignados + ' asignados', 'var(--green)') + kp('Ausentes', r.ausentes.length, 'asignados sin entrada', 'var(--red)') + kp('Por autorizar', r.pendientes, 'fuera de zona, compañeros, anticipados y extras', '#B57F00') + kp('Sin salida ayer', r.sinSalidaAyer, 'avisado a los responsables', 'var(--fg)') + '</div>' +
      avisoPedidos(r.pedidosGerencia) +
      '<span class="small muted" style="font-weight:600;letter-spacing:1px">SEMANA · PRESENTES Y AUSENTES POR DÍA</span><div class="kpis">' + sem + '</div>' +
      '<span class="small muted" style="font-weight:600;letter-spacing:1px">PRESENTES POR OBRA</span><div class="tblwrap"><table class="tbl"><thead><tr><th>Obra</th><th>Asignados</th><th>Presentes</th><th>Diferencia</th><th>Semáforo</th></tr></thead><tbody>' + (obras || '<tr><td colspan="5" class="muted">Sin obras</td></tr>') + '</tbody></table></div>' +
      '<span class="small muted" style="font-weight:600;letter-spacing:1px">AUSENTES DEL DÍA (' + r.ausentes.length + ')</span><div class="tblwrap"><table class="tbl"><thead><tr><th>Legajo</th><th>Nombre</th><th>Categoría</th><th>Grupo</th><th>Obra asignada</th><th>Última fichada</th></tr></thead><tbody>' + (aus || '<tr><td colspan="6" class="muted">Nadie</td></tr>') + '</tbody></table></div>');
    $('#pF').onchange = e => go('planilla', { fecha: e.target.value });
  } catch (e) { errorBox(e.message, null, 'planilla'); }
};
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
ACT.planExcel = async function () {
  try {
    await loadScript(XLSX_URL);
    const r = S.plan, wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Obra', 'Asignados', 'Presentes', 'Semáforo']].concat(r.porObra.map(o => [o.nombre, o.dotacion, o.presentes, o.semaforo]))), 'Presentes por obra');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Legajo', 'Nombre', 'Categoría', 'Grupo', 'Contratista', 'Obra asignada', 'Última fichada']].concat(r.ausentes.map(a => [a.legajo, a.nombre, a.categoria, a.grupo, a.contratista, a.obra, a.ultima]))), 'Ausentes');
    XLSX.writeFile(wb, 'planilla_' + r.fecha + '.xlsx');
  } catch (e) { toast(e.message); }
};

V.importar = function () {
  if (!S.user.aprueba) return go('planilla');
  S.imp = null;
  shell('<div><h1 class="h-display" style="font-size:40px">IMPORTAR PERSONAL</h1><span class="muted">Cargá legajos y PIN desde un Excel.</span></div>' +
    '<div class="dgrid"><div class="card stack"><span class="xs" style="font-weight:600;color:var(--accent);letter-spacing:1px">PASO 1</span><b>Descargá la plantilla</b><span class="small muted">Legajo · Apellido y nombre · Categoría · Grupo (Propio o Subc) · Contratista · Obra asignada · Rol · Email · PIN · Activo</span><button class="btn sm" data-act="impBajar">⬇ Bajar el personal actual</button><span class="xs muted">Bajalo, actualizalo en Excel y volvé a subirlo acá. El PIN no se baja: dejalo vacío y se mantiene el que tienen.</span><button class="btn sm" data-act="impPlantilla">Descargar plantilla .xlsx</button></div>' +
    '<div class="card stack"><span class="xs" style="font-weight:600;color:var(--accent);letter-spacing:1px">PASO 2</span><b>Subí el Excel</b><span class="small muted">El PIN son los últimos 4 números del DNI. No subas el DNI completo: solo esos 4 números, que se guardan cifrados.</span><label class="btn sm" style="position:relative;overflow:hidden">Elegir archivo .xlsx<input type="file" id="impF" accept=".xlsx,.xls,.csv" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label></div>' +
    '<div class="card stack"><span class="xs" style="font-weight:600;color:var(--accent);letter-spacing:1px">PASO 3</span><b>Revisá y confirmá</b><span class="small muted">Los legajos nuevos se agregan, los existentes se actualizan y las filas con errores no se importan. ' + (S.user.gerencia ? '' : 'Solo Gerencia puede cambiar roles: la columna Rol se ignora.') + '</span><span class="small" id="impNombre"></span></div></div>' +
    '<div id="impRes"></div>');
  $('#impF').onchange = leerExcel;
};
ACT.impPlantilla = async function () {
  try {
    await loadScript(XLSX_URL);
    const ws = XLSX.utils.aoa_to_sheet([['Legajo', 'Apellido y nombre', 'Categoría', 'Grupo', 'Contratista', 'Obra asignada', 'Rol', 'Email', 'PIN', 'Activo'], ['0123', 'Gómez Pedro', 'Ayudante', 'Propio', '', 'Torre Belgrano', 'empleado', '', '4321', 'si']]);
    ws['!cols'] = [{ wch: 9 }, { wch: 28 }, { wch: 16 }, { wch: 10 }, { wch: 22 }, { wch: 22 }, { wch: 12 }, { wch: 26 }, { wch: 7 }, { wch: 7 }];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Personal');
    XLSX.writeFile(wb, 'plantilla_personal_gvme.xlsx');
  } catch (e) { toast(e.message); }
};
ACT.impBajar = async function (b) {
  b.disabled = true;
  try {
    const r = await api('personalExport'); await loadScript(XLSX_URL);
    const ws = XLSX.utils.aoa_to_sheet([['Legajo', 'Apellido y nombre', 'Categoría', 'Grupo', 'Contratista', 'Obra asignada', 'Rol', 'Email', 'PIN', 'Activo', 'Sector', 'Alta', 'Baja']].concat(r.filas.map(p => [p.legajo, p.nombre, p.categoria, p.grupo, p.contratista, p.obra_asignada, p.rol, p.email, '', p.activo, p.sector, p.alta, p.baja])));
    ws['!cols'] = [{ wch: 9 }, { wch: 30 }, { wch: 22 }, { wch: 10 }, { wch: 18 }, { wch: 24 }, { wch: 14 }, { wch: 26 }, { wch: 7 }, { wch: 7 }, { wch: 16 }, { wch: 11 }, { wch: 22 }];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Personal');
    XLSX.writeFile(wb, 'personal_gvme_' + hoyISO() + '.xlsx'); toast(r.filas.length + ' personas bajadas.');
  } catch (e) { toast(e.message, 5000); }
  b.disabled = false;
};
function clave(h) { return String(h || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' '); }
const COLS = { 'legajo': 'legajo', 'apellido y nombre': 'nombre', 'nombre': 'nombre', 'nombre y apellido': 'nombre', 'categoria': 'categoria', 'grupo': 'grupo', 'contratista': 'contratista', 'obra asignada': 'obra_asignada', 'obra': 'obra_asignada', 'rol': 'rol', 'email': 'email', 'mail': 'email', 'correo': 'email', 'pin': 'pin', 'pin (ultimos 4 dni)': 'pin', 'activo': 'activo', 'sector': 'sector' };
async function leerExcel(ev) {
  const f = ev.target.files[0]; if (!f) return;
  $('#impNombre').textContent = f.name;
  try {
    await loadScript(XLSX_URL);
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets['Personal'] || wb.Sheets[wb.SheetNames.find(n => !/instruc|obras/i.test(n)) || wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
    const filas = raw.map(r => { const o = {}; Object.keys(r).forEach(k => { const c = COLS[clave(k)]; if (c) o[c] = String(r[k]).trim(); }); return o; }).filter(o => Object.values(o).some(v => v !== ''));
    if (!filas.length) throw new Error('No encontré filas. Revisá que la primera fila tenga los títulos de la plantilla.');
    S.imp = filas;
    S.impObras = null;
    const wsO = wb.Sheets['Obras'];
    if (wsO) {
      S.impObras = XLSX.utils.sheet_to_json(wsO, { defval: '', raw: false }).map(r => { const o = {}; Object.keys(r).forEach(k => { const c = { 'id': 'id', 'id tablero': 'id', 'obra': 'nombre', 'nombre': 'nombre', 'dotacion': 'dotacion', 'activa': 'activa' }[clave(k)]; if (c) o[c] = String(r[k]).trim(); }); return o; }).filter(o => o.nombre);
    }
    $('#impNombre').textContent = f.name + ' · ' + filas.length + ' personas' + (S.impObras ? ' · ' + S.impObras.length + ' obras' : '');
    $('#impRes').innerHTML = '<div class="loading"><div class="spin"></div>Revisando…</div>';
    const r = await api('importarPersonal', { filas: filas });
    mostrarPreview(r.preview);
  } catch (e) { $('#impRes').innerHTML = '<div class="card bad">' + esc(e.message) + '</div>'; }
}
function mostrarPreview(pv) {
  const n = { nuevo: 0, actualiza: 0, error: 0 };
  pv.forEach(x => n[x.estado]++);
  const tag = x => x.estado === 'nuevo' ? '<span class="tag ok">Nuevo</span>' : x.estado === 'actualiza' ? '<span class="tag warn">Actualiza</span>' : '<span class="tag bad">' + esc(x.error) + '</span>';
  $('#impRes').innerHTML = '<div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:10px"><span class="tag ok">' + n.nuevo + ' nuevos</span><span class="tag warn">' + n.actualiza + ' actualizan</span><span class="tag bad">' + n.error + ' con error</span></div>' +
    '<div class="tblwrap"><table class="tbl"><thead><tr><th>Fila</th><th>Legajo</th><th>Nombre</th><th>Categoría</th><th>Grupo</th><th>Obra asignada</th><th>PIN</th><th>Estado</th></tr></thead><tbody>' +
    pv.map(x => '<tr><td>' + x.fila + '</td><td>' + esc(x.legajo) + '</td><td><b>' + esc(x.nombre) + '</b></td><td>' + esc(x.categoria) + '</td><td>' + esc(x.grupo) + '</td><td>' + esc(x.obra) + '</td><td>••••</td><td>' + tag(x) + '</td></tr>').join('') + '</tbody></table></div>' +
    '<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" data-act="impConfirmar"' + (n.nuevo + n.actualiza ? '' : ' disabled') + '>IMPORTAR ' + (n.nuevo + n.actualiza) + ' FILAS</button></div>';
}
ACT.impConfirmar = async function (b) {
  b.disabled = true; b.textContent = 'IMPORTANDO…';
  try {
    let txtO = '';
    if (S.impObras && S.impObras.length) {
      if (S.user.ubica) { const o = await api('importarObras', { filas: S.impObras, confirmar: true }); txtO = '<br><span class="small">Obras: ' + o.nuevas + ' nuevas, ' + o.actualizadas + ' actualizadas.</span>'; }
      else txtO = '<br><span class="small">La hoja Obras se ignoró: solo supervisores, jefes de obra y Gerencia pueden crear obras.</span>';
    }
    const r = await api('importarPersonal', { filas: S.imp, confirmar: true });
    $('#impRes').innerHTML = '<div class="card ok"><b>Listo: se importaron ' + r.importados + ' personas.</b>' + txtO + (r.rolesIgnorados ? '<br><span class="small">La columna Rol se ignoró: solo Gerencia puede cambiar roles.</span>' : '') + '</div>';
  } catch (e) { toast(e.message, 6000); b.disabled = false; b.textContent = 'REINTENTAR'; }
};

function avisoPedidos(n) {
  if (!n || !S.user.gerencia) return '';
  const dest = MODO === 'celular' ? 'data-go="sup" data-p=\'{"tab":"pin"}\'' : 'data-go="pin"';
  return '<a href="#" ' + dest + ' class="card row" style="text-decoration:none;color:inherit;border-color:var(--amber);background:var(--amber-soft)"><span><b>' + n + ' pedido' + (n > 1 ? 's' : '') + ' de celular o PIN</b><br><span class="small" style="color:var(--amber-text)">Esperan que Gerencia los apruebe</span></span><span style="color:var(--amber-text);font-weight:600">Ver ›</span></a>';
}
function volverPin() { if (MODO === 'celular') go('sup', { tab: 'pin' }); else go('pin'); }
V.pin = () => S.user.gerencia ? verPin('') : go('planilla');
async function verPin(head) {
  cargando('Cargando pedidos…', MODO === 'celular' ? 'sup' : null);
  try {
    const r = await api('pinPedidos');
    const cards = r.pedidos.map(p => {
      const pin = p.tipo === 'cambio_pin';
      return '<div class="item pend"><div class="row"><div><b>' + esc(p.nombre) + '</b><div class="xs muted">Legajo ' + esc(p.legajo) + ' · ' + esc(p.at) + '</div></div><span class="tag warn">' + (pin ? 'Cambio de PIN' : 'Cambio de celular') + '</span></div>' +
        '<span class="small muted">' + (pin ? 'Pidió un PIN nuevo. Al asignarlo, avisale el número.' : 'Quiere entrar desde otro celular.' + (p.vinculado ? ' Su celular actual está vinculado desde el ' + esc(p.vinculado) + '.' : '') + ' Al aprobar, se cierra la sesión del celular anterior y puede entrar en el nuevo con su legajo y PIN.') + '</span>' +
        (pin ? '<button class="btn sm ok" data-act="pinAsignar" data-l="' + esc(p.legajo) + '">Asignar PIN nuevo</button>' : '<button class="btn sm ok" data-act="desvincular" data-l="' + esc(p.legajo) + '">Aprobar cambio de celular</button>') + '</div>';
    }).join('') || '<div class="card small muted">No hay pedidos pendientes.</div>';
    supShell(head, '<div><h1 class="h-display ' + (MODO === 'escritorio' ? '" style="font-size:40px' : 't-l') + '">CELULARES Y PIN</h1><span class="small muted">Solo Gerencia. Cada cambio queda registrado.</span></div>' +
      '<span class="xs muted" style="font-weight:600;letter-spacing:1px">PEDIDOS PENDIENTES (' + r.pedidos.length + ')</span>' +
      '<div class="' + (MODO === 'escritorio' ? 'dgrid' : 'stack') + '" style="gap:10px">' + cards + '</div>' +
      '<span class="xs muted" style="font-weight:600;letter-spacing:1px;margin-top:8px">SIN PEDIDO</span>' +
      '<div class="' + (MODO === 'escritorio' ? 'dgrid' : 'stack') + '" style="gap:10px"><div class="card stack"><b>Asignar un PIN a mano</b><label class="f">Legajo<input class="inp" id="mL" inputmode="numeric"></label><button class="btn sm" data-act="pinAsignar">Asignar PIN nuevo</button></div>' +
      '<div class="card stack"><b>Desvincular un celular</b><span class="small muted">Usalo cuando alguien cambia o pierde el celular. Después vuelve a ingresar con su legajo y PIN.</span><label class="f">Legajo<input class="inp" id="mD" inputmode="numeric"></label><button class="btn sm" data-act="desvincular">Desvincular</button></div></div>');
  } catch (e) { errorBox(e.message, MODO === 'celular' ? 'sup' : null, MODO === 'celular' ? 'sup' : 'pin'); }
}
ACT.pinAsignar = async function (b) {
  const leg = b.dataset.l || ($('#mL') && $('#mL').value.trim());
  if (!leg) return toast('Poné el legajo.');
  const pin = prompt('PIN nuevo de 4 números para el legajo ' + leg + ':');
  if (pin === null) return;
  if (!/^\d{4}$/.test(pin.trim())) return toast('El PIN tiene que tener 4 números.');
  try { await api('pinAsignar', { legajo: leg, pin: pin.trim() }); toast('PIN asignado. Avisale a la persona.', 5000); volverPin(); } catch (e) { toast(e.message, 5000); }
};
ACT.desvincular = async function (b) {
  const leg = b.dataset.l || ($('#mD') && $('#mD').value.trim());
  if (!leg) return toast('Poné el legajo.');
  if (!confirm('¿Aprobar el cambio de celular del legajo ' + leg + '? Se cierra la sesión del celular anterior y entra en el nuevo con su legajo y PIN.')) return;
  try { const r = await api('desvincular', { legajo: leg }); toast(r.desvinculados ? 'Listo: ya puede entrar desde el celular nuevo.' : 'Ese legajo no tenía celular vinculado. Ya puede entrar.', 5000); volverPin(); } catch (e) { toast(e.message, 5000); }
};
ACT.salir = () => salir(false);

/* ---------- arranque ---------- */
document.addEventListener('contextmenu', e => { if (!e.target.closest('input,textarea')) e.preventDefault(); });
boot();
</script>
</body>
</html>
